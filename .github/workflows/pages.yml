name: Publish dashboard

on:
  push:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      refresh_mode:
        description: "选择本次数据更新范围"
        required: true
        default: market
        type: choice
        options:
          - market
          - financial
  schedule:
    - cron: "37 18 * * 1-5"
      timezone: "Asia/Shanghai"
    - cron: "17 7 * * *"
      timezone: "Asia/Shanghai"

permissions: {}

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set up Python for the audited financial refresh
        if: >-
          (github.event_name == 'workflow_dispatch' && inputs.refresh_mode == 'financial') ||
          (github.event_name == 'schedule' && github.event.schedule == '17 7 * * *')
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: automation/requirements.txt

      - name: Install financial data dependencies
        if: >-
          (github.event_name == 'workflow_dispatch' && inputs.refresh_mode == 'financial') ||
          (github.event_name == 'schedule' && github.event.schedule == '17 7 * * *')
        run: python -m pip install -r automation/requirements.txt

      - name: Check and validate the latest complete annual financials
        if: >-
          (github.event_name == 'workflow_dispatch' && inputs.refresh_mode == 'financial') ||
          (github.event_name == 'schedule' && github.event.schedule == '17 7 * * *')
        run: |
          npm run prepare:financials
          python automation/scripts/update_data.py --financial-only
          npm run apply:financials

      - name: Refresh the shared market snapshot
        if: >-
          (github.event_name == 'workflow_dispatch' && inputs.refresh_mode == 'market') ||
          (github.event_name == 'schedule' && github.event.schedule == '37 18 * * 1-5')
        run: npm run refresh:static

      - name: Try a separate market refresh after the financial check
        if: >-
          (github.event_name == 'workflow_dispatch' && inputs.refresh_mode == 'financial') ||
          (github.event_name == 'schedule' && github.event.schedule == '17 7 * * *')
        continue-on-error: true
        run: npm run refresh:static

      - name: Build the static dashboard
        run: npm run build

      - name: Validate the generated dashboard
        run: |
          npm run check
          node --test tests/static-export.test.mjs
          npx tsx --test tests/watch-pool.test.ts tests/peer-statistics.test.ts tests/excel-export.test.ts tests/custom-financials.test.ts tests/custom-financial-cache.test.ts tests/market-refresh-fx.test.ts

      - name: Preserve the validated snapshot
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/seed-data.json public/data/dashboard.json public/data/financial-status.json
          if ! git diff --cached --quiet; then
            git commit -m "Update validated dashboard data"
            git push
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
